name: Fiyatları güncelle

on:
  schedule:
    - cron: "7 * * * *"            # her saat (UTC)
    - cron: "*/15 6-15 * * 1-5"    # borsa saatlerinde 15 dakikada bir (TR 09:00-18:45)
  workflow_dispatch: {}    # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: fiyatlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Firestore için kütüphane
        run: pip install --quiet google-auth requests
      - name: Fiyatları çek
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/fiyat_guncelle.py
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- fiyatlar.json; then
            echo "Değişiklik yok"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add fiyatlar.json
            git commit -m "Fiyatlar güncellendi"
            git push
          fi
