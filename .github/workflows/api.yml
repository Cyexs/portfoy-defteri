name: API'yi yayınla

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch: {}    # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      AYARLI: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Ayar kontrolü
        if: env.AYARLI != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID ve ANTHROPIC_API_KEY sırları henüz eklenmedi; API yayınlanmadı. Kurulum için README'deki 'Claude yorumu (API)' bölümüne bak."
      - uses: actions/checkout@v4
        if: env.AYARLI == 'true'
      - name: Cloudflare'a yükle
        if: env.AYARLI == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: API adresini uygulamaya yaz
        if: env.AYARLI == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then echo "Adres alınamadı"; exit 0; fi
          printf '{"url": "%s"}\n' "${URL%/}" > api.json
          if git diff --quiet -- api.json 2>/dev/null && git ls-files --error-unmatch api.json >/dev/null 2>&1; then
            echo "Adres aynı"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add api.json
            git commit -m "API adresi güncellendi"
            git pull --rebase
            git push
          fi
