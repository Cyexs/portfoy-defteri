<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15241F">
<meta name="description" content="Midas portföyünü, aylık eklemelerini, altın ve dolar kurunu takip eden kişisel portföy defteri.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portföy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Portföy Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: one-column phone ledger, sticky total on top, four-tab bar at the bottom; widens to a centered 34rem column on desktop. */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #E3E9E5;
  --ink: #15241F;
  --ink-2: #56655F;
  --line: #D3DBD6;
  --accent: #0D6E5A;
  --accent-ink: #FFFFFF;
  --c-kuresel: #2F66C9;
  --c-bist: #C9533A;
  --c-kira: #0D8A6E;
  --c-altin: #B98A1F;
  --good: #11795C;
  --bad: #B83B2C;
  --good-bg: #DDF0E8;
  --bad-bg: #F6E1DD;
  --shadow: 0 1px 2px rgba(21,36,31,.06), 0 6px 20px rgba(21,36,31,.06);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1513; --surface: #18201D; --surface-2: #212B27; --ink: #E6EEEA; --ink-2: #9AA9A3; --line: #2B3632;
  --accent: #3FBF9C; --accent-ink: #0B1210;
  --c-kuresel: #6E9CF0; --c-bist: #EA7C62; --c-kira: #3FBF9C; --c-altin: #E0B547;
  --good: #4CC79F; --bad: #EF7B6A; --good-bg: #173229; --bad-bg: #3A1F1B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #18201D; --surface-2: #212B27; --ink: #E6EEEA; --ink-2: #9AA9A3; --line: #2B3632;
  --accent: #3FBF9C; --accent-ink: #0B1210;
  --c-kuresel: #6E9CF0; --c-bist: #EA7C62; --c-kira: #3FBF9C; --c-altin: #E0B547;
  --good: #4CC79F; --bad: #EF7B6A; --good-bg: #173229; --bad-bg: #3A1F1B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.app { max-width: 34rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Sticky top */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.brand { font-family: var(--f-display); font-size: 19px; letter-spacing: -0.01em; }
.top-total { text-align: right; font-size: 13px; color: var(--ink-2); }
.top-total b { display: block; color: var(--ink); font-family: var(--f-num); font-weight: 500; font-size: 15px; }

.banner { background: var(--surface-2); color: var(--ink-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-block: 4px 12px; }

.screen { display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 0 0 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }

/* Hero */
.hero { padding: 22px 20px 20px; background: var(--ink); color: var(--bg); border-radius: 18px; position: relative; overflow: hidden; }
.hero .lbl { font-size: 13px; opacity: .72; }
.hero .big { font-family: var(--f-display); font-size: clamp(34px, 10vw, 46px); line-height: 1.05; margin: 6px 0 12px; letter-spacing: -0.02em; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hero .toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.hero .refresh { border: 0; border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); cursor: pointer; }
.hero .refresh svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero .refresh:disabled { opacity: .7; cursor: default; }
.hero .refresh.spin svg { animation: spin 1s linear infinite; }
.hero .esd { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-num); font-size: 14px; opacity: .85; margin: -4px 0 14px; position: relative; z-index: 1; }
.hero .info { font-size: 12px; opacity: .68; margin-top: 12px; line-height: 1.5; position: relative; z-index: 1; }
.hero .big, .hero .chips { position: relative; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; font-family: var(--f-num); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.plain { background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); font-family: var(--f-body); font-weight: 500; }
.hero .coin { position: absolute; right: -38px; top: -38px; width: 150px; height: 150px; border-radius: 50%; border: 22px solid color-mix(in srgb, var(--accent) 55%, transparent); opacity: .35; pointer-events: none; }

/* Allocation */
.alloc { display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; }
@media (max-width: 360px) { .alloc { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 132px; height: 132px; display: block; }
.legend { display: grid; gap: 10px; min-width: 0; width: 100%; }
.lg { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.track { grid-column: 2 / 4; height: 6px; background: var(--surface-2); border-radius: 99px; position: relative; margin-top: -4px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.track .tg { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 2px; }

/* Lists */
.list { display: grid; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.item .k { font-weight: 700; letter-spacing: .02em; }
.item .sub { font-size: 12.5px; color: var(--ink-2); }
.item .v { text-align: right; font-family: var(--f-num); font-size: 14px; }
.item .p { text-align: right; font-family: var(--f-num); font-size: 12.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.grp-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-top: 4px; }
.grp-h .sw { width: 8px; height: 8px; }
.grp-h span:last-child { margin-left: auto; font-family: var(--f-num); font-weight: 500; color: var(--ink-2); font-size: 13px; }

/* Buttons & forms */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field input, .field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-family: var(--f-num); font-size: 16px; }
.field select, .field input[type=text] { font-family: var(--f-body); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }

/* Plan */
.amount { display: flex; align-items: baseline; gap: 8px; }
.amount input { font-family: var(--f-display); font-size: 40px; width: 100%; border: 0; background: transparent; padding: 0; border-bottom: 2px solid var(--line); border-radius: 0; }
.amount input:focus { outline: none; border-bottom-color: var(--accent); }
.amount span { font-family: var(--f-display); font-size: 28px; color: var(--ink-2); }
.split { display: grid; gap: 14px; }
.sp { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.sp .n { font-weight: 700; }
.sp .t { font-family: var(--f-num); font-weight: 500; font-size: 17px; text-align: right; }
.sp .h { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.sp .bar { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.sp .bar i { display: block; height: 100%; border-radius: 99px; }
.sp.zero .t { color: var(--ink-2); }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

/* Charts */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--f-num); font-size: 10.5px; fill: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--ink-2); }
.stat .x { font-family: var(--f-num); font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }

.empty { text-align: center; padding: 18px 8px; color: var(--ink-2); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 18px; margin-bottom: 4px; }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 34rem; margin-inline: auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--nav-h); }
.nav button { font-size: 11px; }
.nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,14,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 34rem; border-radius: 20px 20px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92%; overflow: auto; }
.sheet h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: -6px auto 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: no-preference) {
  .screen > * { animation: rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .screen > *:nth-child(2) { animation-delay: .04s; } .screen > *:nth-child(3) { animation-delay: .08s; } .screen > *:nth-child(4) { animation-delay: .12s; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet { animation: up .25s cubic-bezier(.2,.7,.2,1); }
  @keyframes up { from { transform: translateY(24px); } to { transform: none; } }
}

/* v5: grouped holdings */
.gcard { background: color-mix(in srgb, var(--gc) 7%, var(--surface)); border-top: 4px solid var(--gc); padding-top: 14px; }
.gcard .gtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gcard .gname { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; min-width: 0; flex-wrap: wrap; }
.gcard .gcount { font-weight: 500; font-size: 12.5px; color: var(--ink-2); }
.gcard .gval { font-family: var(--f-display); font-size: 21px; white-space: nowrap; }
.gcard .gmeta { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 6px; font-family: var(--f-num); }
.gcard .item { border-top-color: color-mix(in srgb, var(--gc) 18%, var(--line)); }

/* v4: ideas and news */
.idea-sec { display: grid; gap: 4px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }
.idea-sec:first-of-type { border-top: 0; margin-top: 4px; padding-top: 0; }
.idea-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
.idea-h .amt { margin-left: auto; font-family: var(--f-num); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.idea { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 9px 0; border-top: 1px dashed var(--line); }
.idea:first-of-type { border-top: 0; }
.idea .k { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.idea .r { text-align: right; font-family: var(--f-num); font-size: 13.5px; }
.idea .sub { font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.idea .r2 { text-align: right; font-size: 12.5px; }
.held { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--accent); letter-spacing: .02em; }
.dg { font-family: var(--f-num); font-weight: 500; white-space: nowrap; }
.dg.up { color: var(--good); } .dg.down { color: var(--bad); } .dg.flat { color: var(--ink-2); }
.tips { margin: 6px 0 4px; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink); }
.tipnow { font-size: 13.5px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 4px; }
.news { display: grid; gap: 10px; }
.nitem { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
.nitem .when { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
.nitem a.t { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15.5px; line-height: 1.35; }
.nitem a.t:hover { text-decoration: underline; }
.stk { display: flex; flex-wrap: wrap; gap: 6px; }
.stk span { display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; }
.stk span.mine { box-shadow: inset 0 0 0 1.5px var(--accent); }
.filt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* v3: sign-in gate and Claude review */
.gate { min-height: calc(100vh - 140px); display: grid; align-content: center; gap: 18px; padding-block: 12px 32px; }
.gate .mark { width: 64px; height: 64px; border-radius: 18px; background: #15241F; display: grid; place-items: center; }
.gate .mark svg { width: 44px; height: 44px; }
.gate h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 8vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.gate .lead { color: var(--ink-2); font-size: 15.5px; margin: 0; max-width: 32rem; }
.door { display: grid; gap: 10px; padding: 18px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
.door b { font-size: 16px; }
.door ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; display: grid; gap: 3px; }
.door.primary { outline: 2px solid var(--accent); outline-offset: -2px; }
.fine { font-size: 12.5px; color: var(--ink-2); text-align: center; margin: 0; }
.ai-out { display: grid; gap: 10px; font-size: 15px; line-height: 1.6; }
.ai-out h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 8px 0 0; }
.ai-out p { margin: 0; }
.ai-out ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ai-out b { font-weight: 700; }
.ai-meta { font-size: 12.5px; color: var(--ink-2); }
.think { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; }
.think i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .think i { animation: pulse 1.1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } } }
.ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.ask input { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; min-width: 0; }
.lock { display: grid; gap: 12px; text-align: center; padding: 6px 2px; }
.lock b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.lock p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* v2 additions */
.kurrow { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; }
.kurrow .src { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.kurctl { display: flex; gap: 8px; align-items: center; }
.kurctl input { width: 7.5rem; padding: 10px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-family: var(--f-num); font-size: 16px; }
.btn.sm { width: auto; padding: 10px 14px; font-size: 14px; border-radius: 10px; }
.btn.icon { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { font-size: 12.5px; color: var(--ink-2); min-height: 1.2em; text-align: center; }
.status.ok { color: var(--good); }
.chk { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
.chk input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.imp-item { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.imp-item:first-child { border-top: 0; }
.imp-item input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.imp-item .k { font-weight: 700; }
.imp-item .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-2); font-family: var(--f-num); }

<script>
(() => {
  const GR = [

  const AN = Object.fromEntries(ALTIN.map(a => [a.k, a]));

  const col = (k) => `var(${(GN[k] || GN.bist).c})`;
  const ICON = {
    refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
    image: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
    cloud: '<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 18z"/>',
    phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
    down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    up: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'

  const icon = (n) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = ICON[n]; return s; };

  const STANDALONE = typeof window.claude === 'undefined';

  // Screenshot reading only exists in the claude.ai build; the app itself has no AI features.

  /* ---------- accounts (GitHub version): Google or e-mail sign-in, notebook kept in Firestore ----------
     Turned on by firebase-ayar.json next to the page; without it the app stays device-only. */
  const FB_SURUM = '10.14.1';
  const FB = { hazir: false, user: null, db: null, auth: null, m: null };
  async function fbInit() {
    if (!STANDALONE || FB.m) return;
    let ayar = null;
    try { const r = await fetch('firebase-ayar.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) ayar = await r.json(); } catch (e) {}
    if (!ayar || !ayar.apiKey || !ayar.projectId) return;
    try {
      const u = (n) => 'https://www.gstatic.com/firebasejs/' + FB_SURUM + '/firebase-' + n + '.js';
      const [app, auth, fs] = await Promise.all([import(u('app')), import(u('auth')), import(u('firestore'))]);
      const a = app.initializeApp(ayar);
      FB.auth = auth.getAuth(a); FB.auth.languageCode = 'tr';
      let store; try { store = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache() }); } catch (e) { store = fs.getFirestore(a); }
      FB.m = { auth, fs }; FB.store = store; FB.hazir = true;
      try { const rr = await auth.getRedirectResult(FB.auth); if (rr && rr.user) FB.user = rr.user; } catch (e) {}
      if (!FB.user) FB.user = await new Promise((res) => { const un = auth.onAuthStateChanged(FB.auth, (us) => { un(); res(us); }); });
      if (FB.user) FB.db = fsAdapter(fs, store);
    } catch (e) { FB.hazir = false; FB.user = null; }
  }
  // Same small surface the rest of the app already uses for cloud storage.
  function fsAdapter(fs, store) {
    const snapDoc = (s) => ({ exists: s.exists(), data: () => s.data() });
    const d = (ref) => ({
      get: async () => snapDoc(await fs.getDoc(ref)),
      set: (data) => fs.setDoc(ref, data),
      delete: () => fs.deleteDoc(ref),
      onSnapshot: (ok, err) => fs.onSnapshot(ref, (s) => ok(snapDoc(s)), err),
      collection: (name) => c(fs.collection(ref, name), [])
    });
    const c = (ref, cons) => ({
      doc: (id) => d(fs.doc(ref, id)),
      limit: (n) => c(ref, [...cons, fs.limit(n)]),
      orderBy: (f, y) => c(ref, [...cons, fs.orderBy(f, y)]),
      onSnapshot: (ok, err) => fs.onSnapshot(fs.query(ref, ...cons), (q) => ok({ docs: q.docs.map(x => ({ id: x.id, data: () => x.data() })) }), err)
    });
    return { doc: (path) => d(fs.doc(store, path)) };
  }
  const AUTH_HATA = {
    'auth/invalid-email': 'E-posta adresi geçersiz.', 'auth/missing-email': 'E-posta adresini yaz.', 'auth/missing-password': 'Şifreni yaz.',
    'auth/weak-password': 'Şifre en az 6 karakter olmalı.', 'auth/email-already-in-use': 'Bu e-postayla zaten bir hesap var; Giriş yap\'a bas.',
    'auth/invalid-credential': 'E-posta ya da şifre yanlış.', 'auth/wrong-password': 'E-posta ya da şifre yanlış.', 'auth/user-not-found': 'Bu e-postayla bir hesap yok; Kayıt ol\'a bas.',
    'auth/too-many-requests': 'Çok fazla deneme yapıldı; birkaç dakika sonra tekrar dene.', 'auth/network-request-failed': 'İnternet bağlantısı yok gibi görünüyor.',
    'auth/popup-closed-by-user': 'Google girişi yarıda kaldı; tekrar dene.', 'auth/cancelled-popup-request': 'Google girişi yarıda kaldı; tekrar dene.',
    'auth/unauthorized-domain': 'Bu adres Firebase\'de izinli değil (Authentication → Settings → Authorized domains).', 'auth/operation-not-allowed': 'Bu giriş yöntemi Firebase\'de açılmamış.',
    'auth/requires-recent-login': 'Güvenlik için çıkış yapıp yeniden giriş yap, sonra tekrar dene.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase ayarındaki apiKey hatalı (firebase-ayar.json).', 'auth/invalid-api-key': 'Firebase ayarındaki apiKey hatalı (firebase-ayar.json).',
    'auth/configuration-not-found': 'Firebase\'de giriş yöntemleri açılmamış (Authentication → Sign-in method).'
  };
  const authMesaj = (e) => AUTH_HATA[e && e.code] || 'İşlem tamamlanamadı; tekrar dene.';
  function girisTamam() {
    const k = onayKaydi() || {};
    try { localStorage.setItem('pd-onay', JSON.stringify({ ...k, bulutRiza: true, bulutRizaZaman: new Date().toISOString() })); } catch (e) {}
    setGiris('hesap'); toast('Giriş yapıldı'); setTimeout(() => location.reload(), 500);
  }
  function girisSheet() {
    if (!FB.hazir) { toast('Hesap girişi şu an kullanılamıyor.'); return; }
    const A = FB.m.auth;
    const st = el('div', { class: 'status', role: 'status' });
    const yaz = (t, cls) => { st.className = 'status' + (cls ? ' ' + cls : ''); st.textContent = t; };
    const rz = el('input', { type: 'checkbox', id: 'bulut-riza' });
    const rizaVar = () => { if (rz.checked) return true; yaz('Devam etmek için verilerinin hesabında saklanmasına onay ver.', 'warn'); rz.focus(); return false; };
    const busy = (b) => sh.sheet.querySelectorAll('button.btn').forEach(x => { x.disabled = b; });
    const google = el('button', { class: 'btn', type: 'button', text: 'Google ile devam et' });
    google.addEventListener('click', async () => {
      if (!rizaVar()) return;
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      busy(true); yaz('Google açılıyor…');
      try { await A.signInWithPopup(FB.auth, p); girisTamam(); }
      catch (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
          const k = onayKaydi() || {}; try { localStorage.setItem('pd-onay', JSON.stringify({ ...k, bulutRiza: true, bulutRizaZaman: new Date().toISOString() })); } catch (er) {}
          setGiris('hesap'); try { await A.signInWithRedirect(FB.auth, p); return; } catch (er) { e = er; }
        }
        busy(false); yaz(authMesaj(e), 'warn');
      }
    });
    const ep = el('input', { id: 'g-eposta', type: 'email', autocomplete: 'email', inputmode: 'email', autocapitalize: 'off', spellcheck: 'false' });
    const sf = el('input', { id: 'g-sifre', type: 'password', autocomplete: 'current-password', minlength: '6' });
    const degerler = () => ({ e: ep.value.trim(), s: sf.value });
    const epostaIle = async (kayit) => {
      const { e, s } = degerler();
      if (!e) { yaz('E-posta adresini yaz.', 'warn'); ep.focus(); return; }
      if (!s) { yaz('Şifreni yaz.', 'warn'); sf.focus(); return; }
      if (!rizaVar()) return;
      busy(true); yaz(kayit ? 'Hesabın oluşturuluyor…' : 'Giriş yapılıyor…');
      try {
        if (kayit) { const r = await A.createUserWithEmailAndPassword(FB.auth, e, s); try { await A.sendEmailVerification(r.user); } catch (er) {} }
        else await A.signInWithEmailAndPassword(FB.auth, e, s);
        girisTamam();
      } catch (er) { busy(false); yaz(authMesaj(er), 'warn'); }
    };
    const unuttum = el('button', { class: 'lnk', type: 'button', text: 'Şifremi unuttum', onclick: async () => {
      const { e } = degerler(); if (!e) { yaz('Önce e-posta adresini yaz, sonra Şifremi unuttum\'a bas.', 'warn'); ep.focus(); return; }
      try { await A.sendPasswordResetEmail(FB.auth, e); yaz('Şifre yenileme bağlantısı ' + e + ' adresine gönderildi. Gelen kutunu (ve spam klasörünü) kontrol et.', 'ok'); }
      catch (er) { yaz(authMesaj(er), 'warn'); }
    } });
    const sh = openSheet('Giriş yap ya da kayıt ol', [
      el('p', { class: 'small muted', style: 'margin:0', text: S.p.pozisyonlar.length ? 'Bu telefondaki varlıkların, hesabın boşsa hesabına taşınır.' : 'Hesabın varsa giriş yap; yoksa aynı bilgilerle kayıt ol.' }),
      el('label', { class: 'chk', for: 'bulut-riza' }, [rz, el('span', {}, ['Verilerimin (e-posta adresim ve portföy bilgilerim) hesabımda saklanması için Google Firebase\'e aktarılmasına ', lnk('riza', 'Açık Rıza Metni'), ' kapsamında rıza veriyorum.'])]),
      google,
      el('div', { class: 'ayrac', text: 'ya da e-postayla' }),
      el('div', { class: 'fgrid' }, [
        el('div', { class: 'field full' }, [el('label', { for: 'g-eposta', text: 'E-posta' }), ep]),
        el('div', { class: 'field full' }, [el('label', { for: 'g-sifre', text: 'Şifre (en az 6 karakter)' }), sf])
      ]),
      el('div', { class: 'btns' }, [
        el('button', { class: 'btn', type: 'button', text: 'Giriş yap', onclick: () => epostaIle(false) }),
        el('button', { class: 'btn ghost', type: 'button', text: 'Kayıt ol', onclick: () => epostaIle(true) })
      ]),
      el('div', { style: 'text-align:center' }, [unuttum]),
      st,
      el('button', { class: 'btn ghost', type: 'button', text: 'Vazgeç', onclick: () => sh.close() })
    ]);
  }
  /* Roles live in roller/{uid}; the app can read its own role but never write it (see firestore.rules).
     'sahip' unlocks the owner-only screener lists, which are stored in sahip/oneriler and readable only by the owner. */
  const sahip = () => !STANDALONE || S.rol === 'sahip';
  async function rolYukle() {
    if (!STANDALONE || !FB.user || !FB.db) return;
    try { const r = await FB.db.doc('roller/' + FB.user.uid).get(); S.rol = r.exists ? String((r.data() || {}).rol || '') : ''; } catch (e) { S.rol = ''; }
    if (S.rol === 'sahip') { try { const o = await FB.db.doc('sahip/oneriler').get(); if (o.exists) S.oneriler = o.data(); } catch (e) {} }
  }
  async function cikisYap() {
    try { if (FB.m && FB.auth) await FB.m.auth.signOut(FB.auth); } catch (e) {}
    try { localStorage.removeItem('pd-onay'); } catch (e) {}
    setGiris(null); toast('Çıkış yapıldı'); setTimeout(() => location.reload(), 500);
  }
  async function hesabiSil() {
    if (!FB.user) return;
    try {
      for (const x of S.ekl) await portRef().collection('eklemeler').doc(x.id).delete();
      for (const x of S.gec) await portRef().collection('gecmis').doc(x.id).delete();
      await portRef().delete();
    } catch (e) { toast('Veriler silinemedi; internetini kontrol edip tekrar dene.'); return; }
    try { await FB.m.auth.deleteUser(FB.user); }
    catch (e) { toast(e && e.code === 'auth/requires-recent-login' ? 'Verilerin silindi. Hesabı da silmek için çıkış yapıp yeniden giriş yap ve tekrar dene.' : authMesaj(e)); return; }
    try { localStorage.removeItem(LS); localStorage.removeItem('pd-onay'); localStorage.removeItem('pd-giris'); localStorage.removeItem('pd-tab'); } catch (e) {}
    toast('Hesabın ve tüm verilerin silindi'); setTimeout(() => location.reload(), 900);
  }

  const EMPTY = () => ({ kur: 49.28, kurKaynak: 'elle', kurTarih: '', aylik: 2000, hedef: { kuresel: 30, bist: 30, kira: 30, altin: 10 }, pozisyonlar: [] });
  const S = {
    loaded: false, mode: 'yukleniyor', db: null, uid: null, sample: null, imgLim: null, dl: null, ortakKur: null, ortakAltin: null,
    p: EMPTY(), ekl: [], gec: [], tab: 'ozet', calc: null, rol: ''
  };
  try { const t = localStorage.getItem('pd-tab'); if (t) S.tab = t; } catch (e) {}

  /* ---------- format ---------- */
  const tl0 = (v) => '₺' + Number(v || 0).toLocaleString('tr-TR', { maximumFractionDigits: 0 });
  const n2 = (v, d = 2) => Number(v || 0).toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const nAuto = (v) => Number(v).toLocaleString('tr-TR', { maximumFractionDigits: 6 });
  const sgnTl = (v) => (v > 0.5 ? '+' : v < -0.5 ? '−' : '') + tl0(Math.abs(v));
  const sgnPct = (v) => (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + '%' + n2(Math.abs(v), 1);
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const trDate = (s) => new Date(s + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  const trShort = (s) => new Date(s + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
  const trMonth = (ym) => new Date(ym + '-15T12:00:00').toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
  const parseNum = (s) => { if (s == null) return NaN; s = String(s).trim().replace(/\s/g, ''); if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); };
  const el = (tag, attrs = {}, kids = []) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.setAttribute('style', v);
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'checked') e.checked = !!v; else e.setAttribute(k, v);
    }
    for (const c of [].concat(kids)) if (c != null) e.append(c);
    return e;
  };
  const svgEl = (tag, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------- math ---------- */
  const fx = (p) => p.birim === 'USD' ? S.p.kur : 1;
  const val = (p) => Number(p.adet) * Number(p.fiyat) * fx(p);
  const cost = (p) => Number(p.adet) * Number(p.maliyet) * fx(p);
  function totals(list = S.p.pozisyonlar) {
    const g = Object.fromEntries(GR.map(x => [x.k, 0])), gc = Object.fromEntries(GR.map(x => [x.k, 0]));
    let T = 0, C = 0;
    for (const p of list) { const v = val(p), c = cost(p); T += v; C += c; const k = g[p.grup] != null ? p.grup : 'bist'; g[k] += v; gc[k] += c; }
    return { T, C, kz: T - C, kzp: C ? (T - C) / C * 100 : 0, g, gc };
  }
  function split(amount) {
    const { T, g } = totals();

  function lineChart(series, labels, opts = {}) {

    const s = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': opts.label || 'Grafik' });
    const all = series.flatMap(x => x.v);
    let lo = Math.min(...all), hi = Math.max(...all);
    if (hi === lo) { hi = hi * 1.05 + 1; lo = lo * 0.95; }
    const pd = (hi - lo) * 0.1; hi += pd; lo -= pd;
    const x = (i) => n < 2 ? (L + W - Rr) / 2 : L + (W - Rr - L) * i / (n - 1);
    const y = (v) => Tp + (H - B - Tp) * (1 - (v - lo) / (hi - lo));

    }

      s.append(svgEl('circle', { cx: x(n - 1), cy: y(se.v[n - 1]), r: 3.5, fill: se.c }));

    async function doSave() {

      if (i >= 0 && JSON.stringify(arr[i]) === JSON.stringify(np)) return;
      if (i >= 0) arr[i] = np; else arr.push(np);
      busy = true; status.className = 'status'; status.textContent = 'Kaydediliyor…';
      const ok = await commitPositions(arr, countBox.checked);

      if (f && (!fi.value || fi.dataset.auto === '1')) { fi.value = n2(f, f < 10 ? 4 : 2); fi.dataset.auto = '1'; turNote.hidden = false; turNote.textContent = 'Güncel fiyat piyasadan otomatik alındı.'; }

    const form = el('div', { class: 'fgrid', oninput: (e) => { if (e.target.id === 'e-fiyat') e.target.dataset.auto = ''; if (e.target.id === 'e-kod') autoFiyat(); sched(); }, onchange: (e) => { if (e.target === turSel) turTouched = true; if (e.target === grpSel || e.target === turSel) sync(); if (e.target === grpSel || e.target === birSel) autoFiyat(); sched(); } }, [

      el('div', { class: 'field' }, [el('label', { for: 'e-birim', text: 'Para birimi' }), birSel]),

  const connected = () => !!(S.uid && S.sample && !S.sampleDenied);
  async function connectNow(btn) {
    if (!S.riza) { rizaIste(() => connectNow(btn)); return; }
    const cl = window.claude;
    const perms = cl && cl.use ? await cl.use('permissions').catch(() => null) : null;
    if (!cl || !perms) { toast('Önce claude.ai\'de oturum aç, sonra bu bağlantıyı yeniden aç.'); return; }
    if (btn) btn.disabled = true;
    let st = {};
    try { st = await perms.request(['sample', 'db', 'user', 'downloads']); } catch (e) {}
    if (btn) btn.disabled = false;
    if (st.sample === 'denied') {
      try { await perms.manage(); st.sample = await perms.state('sample'); } catch (e) { toast('Sayfanın İzinler menüsünden Claude erişimini açabilirsin.'); return; }
    }
    if (st.sample === 'granted' || st.sample === 'prompt' || st.db === 'granted') { toast('Bağlanıyor…'); setTimeout(() => location.reload(), 400); }
    else toast('Bağlantı kurulamadı. claude.ai\'de oturum açık olduğundan emin ol.');
  }

  document.getElementById('imgPick').addEventListener('change', (e) => { const files = Array.from(e.target.files || []); if (files.length) importImages(files.slice(0, (S.imgLim && S.imgLim.maxCount) || 4)); });

  const PROMPT = `Bu görüntüler bir yatırım uygulamasının (çoğunlukla Midas) portföy ekranından. Görünen her varlığı oku.
Sadece şu JSON'u döndür: {"varliklar":[{"kod":"THYAO","ad":"Türk Hava Yolları","grup":"bist","birim":"TL","adet":2,"fiyat":283.0,"maliyet":300.0}]}
Kurallar:
- Sayıları nokta ondalıklı JSON sayısı yaz. Ekranda Türkçe biçim olabilir: "1.234,56" = 1234.56, "0,2050" = 0.205.
- "fiyat" birim fiyat (güncel), "maliyet" birim başına ortalama maliyettir. Toplam pozisyon tutarını fiyat yerine yazma.
- "birim": ABD hisseleri ve ETF'ler (fiyat $ ile) için "USD", diğerleri "TL".
- "grup": ABD hisse/ETF → "kuresel"; Borsa İstanbul hisseleri ve hisse senedi fonları → "bist"; kira sertifikası, para piyasası, borçlanma araçları fonları → "kira"; altın veya kıymetli maden fonları → "altin". Emin değilsen fon adına göre tahmin et.
- Ekranda görünmeyen bir alanı uydurma; null yaz. Grup başlıklarını (ör. "ABD Hisseleri") varlık sayma.

  async function importImages(files) {
    let ctl = new AbortController();
    const stat = el('div', { class: 'status', text: 'Ekran görüntüsü okunuyor… Bu 10–40 saniye sürebilir.' });
    const sh = openSheet('Görüntüden okuma', [el('div', { class: 'dropzone' }, [icon('image'), el('div', { text: files.length + ' görüntü seçildi' }), stat]), el('button', { class: 'btn ghost', type: 'button', text: 'Vazgeç', onclick: () => { ctl.abort(); sh.close(); } })]);
    let res;
    try { res = await S.sample.json(PROMPT, { images: files, signal: ctl.signal }); }
    catch (e) {
      if (e && e.code === 'cancelled') return;
      let msg = { not_granted: 'Görüntü okuma için izin verilmedi.', rate_limited: 'Şu an çok fazla istek var; biraz sonra tekrar dene.', image_rejected: 'Bu görüntü okunamadı; başka bir ekran görüntüsü dene.', invalid_json: 'Görüntüden varlık listesi çıkarılamadı; daha net bir ekran görüntüsü dene.', session_expired: 'Oturumun kapanmış; claude.ai\'ye tekrar giriş yap.', images_unavailable: 'Bu görünümde görüntü okunamıyor.' }[e && e.code] || 'Okuma tamamlanamadı; tekrar dene.';
      if (e && (e.code === 'not_granted' || e.code === 'session_expired')) { S.sampleDenied = true; sh.close(); render(); connectSheet(msg + ' Tekrar denemek için Claude ile bağla.'); return; }
      if (e && e.name === 'AbortError') return;
      if (e && e.code === 'api') msg = e.message;
      if (e && e.code === 'images_unavailable') msg = 'Bu uygulama görünümünde görüntü gönderilemiyor. Sayfayı tarayıcıda (claude.ai) açıp tekrar dene.';
      stat.textContent = msg; stat.className = 'status warn'; return;
    }
    const items = (res && Array.isArray(res.varliklar) ? res.varliklar : Array.isArray(res) ? res : []).map(x => ({
      kod: String(x.kod || '').trim().toUpperCase(), ad: String(x.ad || '').trim(), grup: GN[x.grup] ? x.grup : 'bist', birim: x.birim === 'USD' ? 'USD' : 'TL',

    })).filter(x => x.kod);
    sh.close();
    if (!items.length) { toast('Görüntüde varlık bulunamadı.'); return; }
    reviewImport(items);
  }

  function reviewImport(items) {
    const wasEmpty = !S.p.pozisyonlar.length;
    const ok = (x) => x.adet >= 0 && x.fiyat >= 0 && x.maliyet >= 0 && [x.adet, x.fiyat, x.maliyet].every(Number.isFinite);
    const boxes = [];
    const rows = items.map((x, i) => {
      const ex = S.p.pozisyonlar.find(p => p.kod === x.kod), good = ok(x);
      const cb = el('input', { type: 'checkbox', id: 'imp-' + i, checked: good, disabled: good ? false : 'disabled', 'aria-label': x.kod + ' kaydet' }); boxes.push(cb);
      const cur = x.birim === 'USD' ? '$' : '₺';
      return el('label', { class: 'imp-item', for: 'imp-' + i }, [cb, el('span', { class: 'k', text: x.kod + (x.ad ? ' · ' + x.ad : '') }),
        el('span', { class: 'tag ' + (!good ? 'miss' : ex ? '' : 'new'), text: !good ? 'Eksik bilgi' : ex ? 'Güncellenecek' : 'Yeni' }),
        el('span', { class: 'sub', text: good ? nAuto(x.adet) + ' adet · fiyat ' + cur + n2(x.fiyat) + ' · maliyet ' + cur + n2(x.maliyet) + ' · ' + GN[x.grup].n : 'Okunamayan alanları sonra elle tamamlayabilirsin' })]);
    });
    const say = el('input', { type: 'checkbox', id: 'imp-say', checked: !wasEmpty });
    const saveBtn = el('button', { class: 'btn', type: 'button', text: 'Seçilenleri kaydet', onclick: async () => {

      saveBtn.disabled = true;
      const arr = S.p.pozisyonlar.slice();
      for (const x of chosen) { const i = arr.findIndex(p => p.kod === x.kod); const prev = i >= 0 ? arr[i] : null; const np = { ...x, ad: x.ad || (prev && prev.ad) || '' }; if (i >= 0) arr[i] = np; else arr.push(np); }
      const done = await commitPositions(arr, say.checked);

    } });
    editing = true;
    const sh = openSheet('Okunan varlıklar', [

      el('div', {}, rows),
      el('label', { class: 'chk', for: 'imp-say' }, [say, el('span', { text: wasEmpty ? 'Bu bir başlangıç kaydı; bu ayın eklemesine sayma (önerilen)' : 'Maliyetteki artışı bu ayın eklemesine say' })]),

  }

        'Hesap bilgileri: e-posta adresin; Google ile girersen Google hesabındaki adın ve profil fotoğrafının adresi; Firebase kullanıcı kimliği; hesap oluşturma ve son giriş zamanı. E-postayla kayıt olursan şifren Firebase\'de geri çevrilemez biçimde (hash) tutulur; Geliştirici şifreni göremez.',
        'Finansal bilgiler: varlık kodu ve adı, adet, fiyat, ortalama maliyet, aylık ekleme tutarı, hedef oranlar, günlük değer geçmişi.',
        'Teknik bilgiler: sayfa, fiyat dosyası ve yazı tipleri yüklenirken ve giriş yaparken IP adresin ve tarayıcı bilgilerin GitHub ve Google sunucularına iletilir.',
        'Onay kaydı: son onay tarihin, onayladığın metin sürümü ve açık rıza durumun (yalnızca cihazında).'
      ]],
      ['h', 'Amaçlar'],
      ['p', 'Hesabını oluşturmak ve girişini doğrulamak, portföyünü kaydetmek ve cihazların arasında eşitlemek, değerini hesaplamak, aylık ekleme planını göstermek, şifre yenileme ve e-posta doğrulama iletileri göndermek, onaylarını kaydetmek ve Uygulamanın güvenli çalışmasını sağlamak.'],
      ['h', 'Hukuki sebepler'],
      ['ul', [
        'KVKK md. 5/2-c: hesabın ve Kullanım Şartları kapsamındaki hizmetin sunulması için zorunlu olması.',
        'KVKK md. 5/2-f: Uygulamanın ve hesapların güvenliği için meşru menfaat.',
        'KVKK md. 5/1 ve md. 9: hesap verilerinin Google\'ın yurt dışındaki sunucularında saklanması için giriş yaparken verdiğin açık rıza.'
      ]],
      ['h', 'Toplama yöntemi'],
      ['p', 'Portföy bilgilerini sen girersin. Hesap bilgilerin Google ile girişte Google\'dan, e-postayla kayıtta senden alınır. Değer geçmişi ve onay kaydı otomatik oluşur. Hepsi elektronik ortamda işlenir.'],
      ['h', 'Kimlere aktarılır'],
      ['ul', [
        'Google LLC ve Google Ireland Ltd. (Firebase Authentication ve Cloud Firestore): hesabının ve hesabındaki portföy verilerinin saklanması. Veritabanı Avrupa\'daki veri merkezlerinde tutulur; Google\'ın destek ve güvenlik işlemleri için başka ülkelerden erişim olabilir.',
        'GitHub, Inc. (ABD): Uygulamanın ve fiyat dosyasının barındırılması (teknik bilgiler).',
        'Google LLC (ABD): yazı tiplerinin yüklenmesi (teknik bilgiler).'
      ]],
      ['p', 'Hesap verilerinin yurt dışına aktarımı KVKK md. 9 çerçevesinde açık rızana dayanır. Hesap açmak zorunlu değildir; rıza vermezsen Uygulamayı hesapsız kullanabilirsin.'],
      ['h', 'Saklama süresi'],
      ['p', 'Cihazındaki veriler sen silene kadar (ya da tarayıcı verisini temizleyene kadar) durur. Hesabındaki veriler sen silene ya da hesabını silene kadar durur. Geçmiş → Yasal metinler bölümündeki "Hesabımı sil" ile hesabını ve tüm verilerini istediğin an silebilirsin; silinen veriler Google\'ın yedekleme süreleri dolduğunda yedeklerden de kalkar.'],
      ['h', 'KVKK md. 11 kapsamındaki hakların'],
      ['ul', [
        'Kişisel verilerinin işlenip işlenmediğini öğrenme, işlenmişse bilgi isteme,',
        'İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme,',
        'Yurt içinde ya da yurt dışında aktarıldığı kişileri bilme,',
        'Eksik ya da yanlış işlenmişse düzeltilmesini isteme,',
        'KVKK md. 7 çerçevesinde silinmesini ya da yok edilmesini isteme,',
        'Düzeltme ve silme işlemlerinin aktarılan kişilere bildirilmesini isteme,',
        'Otomatik sistemlerle analiz sonucu aleyhine bir sonuç çıkmasına itiraz etme,',
        'Hukuka aykırı işleme nedeniyle zarara uğrarsan zararın giderilmesini talep etme.'
      ]],
      ['p', 'Başvurunu yukarıdaki iletişim adresinden yapabilirsin; en geç 30 gün içinde ücretsiz yanıtlanır. Yanıtı yeterli bulmazsan Kişisel Verileri Koruma Kurulu\'na şikâyette bulunabilirsin.']
    ] },
    riza: { t: 'Açık Rıza Metni', b: [
      ['p', 'Bu rıza isteğe bağlıdır. Vermezsen Uygulamayı hesapsız kullanmaya devam edebilirsin.'],
      ['h', 'Hesapta saklama (Google Firebase)'],
      ['p', 'KVKK md. 5/1 ve md. 9 uyarınca; hesabımla giriş yaptığımda e-posta adresimin ve portföy bilgilerimin (varlık kodları ve adları, adet, fiyat, maliyet, hedef oranlar, aylık eklemeler, değer geçmişi), hesabımda saklanması ve cihazlarım arasında eşitlenmesi amacıyla Google LLC ve Google Ireland Ltd.\'nin (Firebase) yurt dışındaki sunucularına aktarılmasına ve orada saklanmasına açık rıza veriyorum.'],
      ['h', 'Geri çekme'],
      ['p', 'Hesapta saklama rızanı geri çekmek için Geçmiş → Yasal metinler → "Hesabımı sil" de; hesabın ve verilerin silinir, Uygulamayı hesapsız kullanmaya devam edersin. Geri çekme ileriye dönük sonuç doğurur.']
    ] }
  };

  function docSheet(k) {
    const d = DOCS[k];
    const body = el('div', { class: 'yasal' }, [el('div', { class: 'meta', text: 'Sürüm: ' + YASAL_SURUM }), ...d.b.map(([t, v]) =>
      t === 'h' ? el('h4', { text: v }) : t === 'ul' ? el('ul', {}, v.map(x => el('li', { text: x }))) :
      t === 'link' ? el('p', {}, [el('a', { href: v, target: '_blank', rel: 'noopener', text: v.replace('https://', '') })]) : el('p', { text: v }))]);
    const sh = openSheet(d.t, [body, el('button', { class: 'btn ghost', type: 'button', text: 'Kapat', onclick: () => sh.close() })]);
  }
  const lnk = (k, text) => el('button', { class: 'lnk', type: 'button', text: text || DOCS[k].t, onclick: (e) => { e.preventDefault(); e.stopPropagation(); docSheet(k); } });

  function onayScreen() {
    const mark = el('div', { class: 'mark', 'aria-hidden': 'true', style: 'width:56px;height:56px;border-radius:16px;background:#15241F;display:grid;place-items:center' });
    mark.innerHTML = '<svg viewBox="0 0 24 24" width="40" height="40"><circle cx="12" cy="12" r="7.5" fill="none" stroke="#6E9CF0" stroke-width="2.4" stroke-dasharray="13.14 47.12" stroke-dashoffset="-0.50" transform="rotate(-90 12 12)"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#EA7C62" stroke-width="2.4" stroke-dasharray="13.14 47.12" stroke-dashoffset="-14.64" transform="rotate(-90 12 12)"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#3FBF9C" stroke-width="2.4" stroke-dasharray="13.14 47.12" stroke-dashoffset="-28.77" transform="rotate(-90 12 12)"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#E0B547" stroke-width="2.4" stroke-dasharray="3.71 47.12" stroke-dashoffset="-42.91" transform="rotate(-90 12 12)"/><text x="12.15" y="15.6" text-anchor="middle" font-family="Young Serif, Georgia, serif" font-size="10.5" fill="#EEF2EF">P</text></svg>';
    const devam = el('button', { class: 'btn', type: 'button', text: 'Onaylıyorum, devam et' });
    const sync = () => { devam.disabled = !(OK.risk && OK.sart && OK.kvkk); };
    const kutu = (k, kids, opt) => {
      const cb = el('input', { type: 'checkbox', id: 'onay-' + k, checked: OK[k], onchange: (e) => { OK[k] = e.target.checked; sync(); } });
      return el('label', { class: 'chk', for: 'onay-' + k }, [cb, el('span', {}, [...kids, opt ? el('span', { class: 'opt', text: 'İsteğe bağlı' }) : null])]);
    };
    devam.addEventListener('click', () => {
      if (devam.disabled) return;
      S.onay = true; S.riza = OK.riza; onayYaz();
      window.scrollTo({ top: 0 }); render(); boot();
    });
    sync();
    const son = onayKaydi();
    return [el('div', { class: 'onay' }, [
      mark,
      el('h1', { text: 'Başlamadan önce' }),
      el('p', { class: 'lead', text: 'Her oturumun başında bu onayı istiyoruz; çıkış yapana ya da metinler değişene kadar tekrar sormayız. Onaylamadan hiçbir hesaba bağlanılmaz ve verin yüklenmez.' }),
      el('div', { class: 'beyan' }, [el('div', { class: 'eb', text: 'Risk beyanı' }), el('p', { text: RISK_BEYAN })]),
      el('div', { class: 'onaylar' }, [
        kutu('risk', ['Yukarıdaki risk beyanını okudum, kabul ediyorum. Ayrıntılar: ', lnk('risk'), '.']),
        kutu('sart', ['18 yaşından büyüğüm. ', lnk('sartlar'), '\'nı okudum, kabul ediyorum.']),
        kutu('kvkk', [lnk('kvkk'), '\'ni okudum.']),
        STANDALONE ? null : kutu('riza', ['Claude özelliklerini kullanırsam verilerimin Anthropic\'e (ABD) aktarılmasına ', lnk('riza', 'Açık Rıza Metni'), ' kapsamında rıza veriyorum.'], true)
      ]),
      devam,
      el('p', { class: 'fine', text: son && son.zaman ? 'Son onayın: ' + trTime(son.zaman) + ' · Metin sürümü ' + YASAL_SURUM : 'Metin sürümü ' + YASAL_SURUM })
    ])];
  }

  /* Any Claude feature asks for the explicit consent first if it was not given at launch. */
  function rizaIste(next) {
    const cb = el('input', { type: 'checkbox', id: 'riza-sonra' });
    const ok = el('button', { class: 'btn', type: 'button', text: 'Rıza veriyorum, devam et', disabled: 'disabled' });
    cb.addEventListener('change', () => { ok.disabled = !cb.checked; });
    const sh = openSheet('Claude için açık rıza', [
      el('p', { style: 'margin:0', text: 'Bu özellik portföy bilgilerini (ve varsa ekran görüntüsünü) yorum üretmek için Anthropic\'e (ABD) gönderir. Bunun için açık rızan gerekiyor.' }),
      el('label', { class: 'chk', for: 'riza-sonra' }, [cb, el('span', {}, [lnk('riza', 'Açık Rıza Metni'), ' kapsamında verilerimin Anthropic\'e aktarılmasına rıza veriyorum.'])]),
      ok, el('button', { class: 'btn ghost', type: 'button', text: 'Vazgeç', onclick: () => sh.close() })
    ]);
    ok.addEventListener('click', () => { if (!cb.checked) return; S.riza = true; onayYaz(); sh.close(); render(); next(); });
  }

  async function verileriSil() {
    if (S.mode === 'bulut' && S.db && S.uid) {
      for (const x of S.ekl) await portRef().collection('eklemeler').doc(x.id).delete().catch(() => {});
      for (const x of S.gec) await portRef().collection('gecmis').doc(x.id).delete().catch(() => {});
      await portRef().delete().catch(() => {});
    }
    try { localStorage.removeItem(LS); localStorage.removeItem('pd-giris'); localStorage.removeItem('pd-tab'); } catch (e) {}
    toast('Verilerin silindi'); setTimeout(() => location.reload(), 900);
  }

  function yasalCard() {
    const son = onayKaydi();
    const docs = el('div', { class: 'doclist' }, ['sartlar', 'risk', 'kvkk', 'riza'].map(k => el('button', { type: 'button', onclick: () => docSheet(k) }, [el('span', { text: DOCS[k].t }), el('span', { text: 'Oku' })])));
    const rizaBtn = STANDALONE ? null : S.riza
      ? el('button', { class: 'btn ghost', type: 'button', text: 'Açık rızamı geri çek', onclick: () => { S.riza = false; onayYaz(); render(); toast('Açık rızan geri çekildi; Claude özellikleri kapandı'); } })
      : el('button', { class: 'btn ghost', type: 'button', text: 'Claude için açık rıza ver', onclick: () => rizaIste(() => toast('Açık rıza verildi')) });
    const silBtn = STANDALONE && FB.user
      ? el('button', { class: 'btn danger', type: 'button', text: 'Hesabımı sil', onclick: (e) => confirmInline(e.currentTarget, hesabiSil, 'Hesabın ve tüm verilerin silinecek. Emin misin?') })
      : el('button', { class: 'btn danger', type: 'button', text: S.mode === 'bulut' ? 'Hesabımdaki verilerimi sil' : 'Bu cihazdaki verilerimi sil', onclick: (e) => confirmInline(e.currentTarget, verileriSil, 'Tüm varlıklar ve geçmiş silinecek. Emin misin?') });
    return card('Yasal metinler', [docs,
      el('p', { class: 'small muted', style: 'margin:10px 0 12px', text: 'Bu oturum için onaylandı' + (son && son.zaman ? ' (' + trTime(son.zaman) + ')' : '') + (STANDALONE ? (FB.user ? ' · Hesap: ' + (FB.user.email || 'Google') + (S.rol ? ' (' + ({ sahip: 'Sahip', pro: 'Pro' }[S.rol] || S.rol) + ')' : '') : ' · Hesapsız') : ' · Claude için açık rıza: ' + (S.riza ? 'verildi' : 'verilmedi')) + ' · Sürüm ' + YASAL_SURUM }),
      el('div', { style: 'display:grid;gap:10px' }, [rizaBtn, silBtn])]);
  }

  /* ---------- render ---------- */
  function render() {
    const main = document.getElementById('main');
    const t = totals();
    document.getElementById('topTotal').textContent = S.p.pozisyonlar.length ? tl0(t.T) : '—';
    document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
    const a = document.activeElement && document.activeElement.id;
    if (a && (['tutar', 'kur', 'aylik', 'aiSoru'].includes(a) || /^h-/.test(a))) return;
    main.textContent = '';
    if (!S.onay) { document.querySelector('.nav').hidden = true; document.getElementById('top').hidden = true; document.getElementById('banner').hidden = true; main.append(el('div', { class: 'screen' }, onayScreen())); return; }
    const gate = needsGate();
    document.querySelector('.nav').hidden = gate; document.getElementById('top').hidden = gate;
    if (gate) { main.append(el('div', { class: 'screen' }, gateScreen())); return; }
    if (S.tab === 'yorum') S.tab = 'ozet';
    const scr = { ozet: scrOzet, varlik: scrVarlik, ay: scrAy, gecmis: scrGecmis, haber: scrHaber }[S.tab] || scrOzet;
    main.append(el('div', { class: 'screen' }, scr().filter(Boolean)));
  }

  document.getElementById('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]'); if (!b) return;
    S.tab = b.dataset.tab; S.calc = null; try { localStorage.setItem('pd-tab', S.tab); } catch (er) {}
    if (document.activeElement) document.activeElement.blur();
    render(); window.scrollTo({ top: 0 });
  });
  window.addEventListener('scroll', () => document.getElementById('top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

  if (STANDALONE && 'serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
  { const k = onayKaydi(); if (k && k.surum === YASAL_SURUM) { S.onay = true; S.riza = !!k.riza; boot(); } else render(); }
})();
</script>
