name = "portfoy-defteri-api"
main = "src/index.js"
compatibility_date = "2025-07-01"
workers_dev = true

# Usage logs stay off: portfolio contents never get written to Cloudflare logs.
[observability]
enabled = false

[vars]
# Only the app's own address may call the API.
IZINLI_KAYNAK = "https://cyexs.github.io"
# Daily limits (Istanbul day). Per person per day, and a ceiling for the whole app.
GUNLUK_YORUM = "3"
GUNLUK_OKU = "5"
GUNLUK_TOPLAM = "60"

[[durable_objects.bindings]]
name = "SAYAC"
class_name = "Sayac"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sayac"]
